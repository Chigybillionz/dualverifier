<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0052ff" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit 1: Web2 Banking Rail -->
  <circle cx="60" cy="60" r="48" stroke="url(#blueGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Outer Orbit 2: Web3 Blockchain Rail (Rotated) -->
  <ellipse cx="60" cy="60" rx="46" ry="24" transform="rotate(-30 60 60)" stroke="#00f0ff" stroke-width="2" opacity="0.8" filter="url(#glow)" />
  <ellipse cx="60" cy="60" rx="46" ry="24" transform="rotate(30 60 60)" stroke="#0052ff" stroke-width="2" opacity="0.5" />

  <!-- Central Shield -->
  <path d="M60 22 L86 34 V62 C86 78 74 91 60 98 C46 91 34 78 34 62 V34 Z" fill="#090d19" stroke="url(#blueGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Dual Rails Intersection Geometry -->
  <path d="M48 48 L60 40 L72 48 V64 L60 72 L48 64 Z" fill="none" stroke="#00f0ff" stroke-width="2" />
  
  <!-- Central Verification Checkmark -->
  <path d="M53 58 L58 63 L69 51" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Dots -->
  <circle cx="60" cy="14" r="3.5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="60" cy="106" r="3.5" fill="#0052ff" filter="url(#glow)" />
  <circle cx="18" cy="45" r="3" fill="#00d2ff" />
  <circle cx="102" cy="75" r="3" fill="#0052ff" />
</svg>

